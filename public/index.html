<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacturaPro — Sistema de Facturación</title>
<meta name="theme-color" content="#153d30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link id="base-stylesheet" rel="stylesheet" href="/Style.css">
</head>
<body>

<!-- ===== PANTALLA DE LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" aria-hidden="true">F</div>
    <h1>FacturaPro</h1>
    <p class="sub">Accede a tu espacio de trabajo</p>
    <div class="login-form">
      <div id="login-error"></div>
      <div>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="nombre@empresa.com" onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>
      <div>
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="Ingresa tu contraseña" onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>
      <button class="login-btn" id="login-btn" onclick="hacerLogin()">Iniciar sesión</button>
    </div>
  </div>
</div>

<!-- ===== APP (oculta hasta iniciar sesión) ===== -->
<div id="app-shell" class="u-hidden">

<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="sidebar-logo">
    <div class="brand-line"><span class="brand-mark">F</span><span class="brand-name">FacturaPro</span></div>
    <small>Gestión comercial</small>
  </div>
  <nav class="nav" aria-label="Navegación principal">
    <div class="nav-section">
      <span class="nav-section-label">Principal</span>
      <button class="nav-item active" title="Dashboard" onclick="goTo('dashboard')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="11" width="7" height="10" rx="1.5"></rect><rect x="3" y="14" width="8" height="7" rx="1.5"></rect></svg></span><span class="nav-label">Dashboard</span></button>
    </div>
    <div class="nav-section">
      <span class="nav-section-label">Gestión comercial</span>
      <button class="nav-item" title="Ventas" onclick="goTo('ventas')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg></span><span class="nav-label">Ventas</span></button>
      <button class="nav-item" title="Comprobantes" onclick="goTo('facturas')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 12h7M9 16h7"></path></svg></span><span class="nav-label">Comprobantes</span></button>
      <button class="nav-item" title="Clientes" onclick="goTo('clientes')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5.2a3.5 3.5 0 0 1 0 6.6M18 14a4.5 4.5 0 0 1 3 4.3v.7"></path></svg></span><span class="nav-label">Clientes</span></button>
      <button class="nav-item" title="Productos" onclick="goTo('productos')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"></path><path d="m3 12 9 5 9-5M3 16l9 5 9-5"></path></svg></span><span class="nav-label">Productos</span></button>
      <button class="nav-item" title="Compras" onclick="goTo('compras')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"></path><path d="m16 3 3 3"></path></svg></span><span class="nav-label">Compras</span></button>
      <button class="nav-item" title="Reportes" onclick="goTo('reportes')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="m7 14 4-4 3 3 6-7"></path></svg></span><span class="nav-label">Reportes</span></button>
    </div>
    <div class="nav-section">
      <span class="nav-section-label">Administración</span>
      <button class="nav-item u-hidden" id="nav-usuarios" title="Usuarios" onclick="goTo('usuarios')"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20v-1a6 6 0 0 1 12 0v1M18 8v6M15 11h6"></path></svg></span><span class="nav-label">Usuarios</span></button>
    </div>
  </nav>
  <div class="sidebar-footer">
    <p>FacturaPro v1.0</p>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-copy">
      <p class="topbar-kicker">OPERACIONES <span aria-hidden="true">/</span> <span id="page-breadcrumb">Dashboard</span></p>
      <h1 id="page-title">Dashboard</h1>
    </div>
    <div class="topbar-right">
      <span id="fecha-top" class="topbar-date"></span>
      <button class="btn btn-primary btn-new" onclick="goTo('ventas')"><span class="btn-plus">+</span><span class="btn-label">Nueva venta</span></button>
      <button class="user-pill u-hidden" id="user-pill" type="button" onclick="abrirModalPerfil()" aria-label="Editar perfil">
        <div class="avatar" id="user-avatar">A</div>
        <span id="user-nombre"></span>
        <span class="role-badge" id="user-rol"></span>
      </button>
      <button class="btn btn-ghost btn-sm btn-logout" onclick="cerrarSesion()"><span aria-hidden="true">↪</span><span class="btn-label">Salir</span></button>
    </div>
  </header>

  <!-- ===== DASHBOARD ===== -->
    <div id="page-views-root"></div>


</main>
    <div id="modal-root"></div>
</div><!-- /app-shell -->

<script>
(async () => {
  const pageNames = ["dashboard","ventas","facturas","clientes","productos","reportes","compras","usuarios"];
  const responses = await Promise.all([
    ...pageNames.map(name => fetch(`/pages/${name}.html`)),
    fetch('/pages/modals.html'),
  ]);
  if (responses.some(response => !response.ok))   throw new Error('No se pudieron cargar las secciones o sus estilos.');
  const fragments = await Promise.all(responses.map(response => response.text()));
  const stylesheetPromises = new Map();
  const preparedFragments = fragments.map(fragment => {
    const template = document.createElement('template');
    template.innerHTML = fragment;
    template.content.querySelectorAll('link[data-page-style]').forEach(link => {
      const href = link.href;
      if (!stylesheetPromises.has(href)) {
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = href;
        stylesheet.dataset.pageStyleLoaded = 'true';
        stylesheetPromises.set(href, new Promise((resolve, reject) => {
          stylesheet.addEventListener('load', resolve, { once: true });
          stylesheet.addEventListener('error', () => reject(new Error(`No se pudo cargar la hoja de estilos ${href}.`)), { once: true });
        }));
        document.head.append(stylesheet);
      }
      link.remove();
    });
    return template.innerHTML;
  });
  await Promise.all(stylesheetPromises.values());
  document.getElementById('page-views-root').innerHTML = preparedFragments.slice(0, pageNames.length).join('\n');
  document.getElementById('modal-root').innerHTML = preparedFragments[pageNames.length];
  const application = document.createElement('script');
  application.src = '/app.js';
  document.body.append(application);
})().catch(error => {
  console.error(error);
  const loginError = document.getElementById('login-error');
  if (loginError) {
    loginError.textContent = 'No se pudieron cargar las secciones o sus estilos. Recarga la página.';
    loginError.style.display = 'block';
  }
});
</script>
</body>
</html>
